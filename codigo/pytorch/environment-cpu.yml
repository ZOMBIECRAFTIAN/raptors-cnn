# Entorno conda para PyTorch SIN CUDA (CPU-only).
# Compatible con cualquier sistema operativo: Windows, Linux, macOS Intel.
# Perfecto para: probar el código, inferencia ligera, máquinas sin GPU NVIDIA.
#
# Crear con:   conda env create -f environment-cpu.yml
# Activar con: conda activate raptors-pt-cpu
#
# Limitaciones:
#   - Entrenamiento real es 20-50x más lento que GPU (no recomendado).
#   - Para entrenar SIN GPU local, usa Google Colab (notebook gratis con T4).
#   - Inferencia (predecir 1 imagen) tarda 1-3 segundos en CPU moderna.

name: raptors-pt-cpu

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # ----- PyTorch CPU-only (sin pytorch-cuda) -----
  - pytorch=2.3.*
  - torchvision=0.18.*
  - torchaudio=2.3.*
  - cpuonly                     # fuerza variante CPU desde el channel pytorch

  # ----- Cómputo numérico y datos -----
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pillow

  # ----- Visualización -----
  - matplotlib
  - seaborn

  # ----- Notebook / desarrollo -----
  - jupyter
  - ipykernel
  - tqdm
  - pyyaml

  # ----- Utilidades de imagen y video -----
  - opencv

  # ----- Herramientas de calidad de código -----
  - black
  - ruff

  - pip
  # Después de crear el env, en una segunda pasada:
  #   conda activate raptors-pt-cpu
  #   pip install -r codigo/pytorch/pip-requirements.txt
